# drawPulseShape, TOFHIR mode, EVENT BY EVENT (SND@LHC run 0305, channel 141)
# model : Andrea's TOFHIR chain (myInSignal, isTOFHIR 1) for ONE p.e., summed over the photons of each Geant4 event
# data  : median ToT(ith1, ith2) grid, built from the TOFHIR file itself (ToT = t_fall(T2) - t_rise(T1))
<Input>
doMinimization 1
isTOFHIR 1
eventByEvent 1

# data straight from the TOFHIR file (no python step needed)
tofhirFile run0305_e.root
tofhirTree data
# disc_calibration.tsv of the config used for the run (run 0305: config_TB_March2026_secondBoard)
discCalibration disc_calibration.tsv
# cfg_a3_range_t1 / cfg_a3_range_t2 from config_runrun0305.ini
rangeT1 1
rangeT2 0
dataChannel 141
# alternative: the ToT grid from makePulseShapeFromToT.py (used only if tofhirFile is absent)
# totGridFile pulseShape_run0305.root
eBandPct 40 60
ebeErrFloor 0.010

# Geant4 SiPM matching TOFHIR channel 141 (check the mapping!)
g4NtupleFile /home/frankreich/sipm-scintilaltor-sim_hexagon/build/sipm_bar_23000_airgap.root
g4Channel 0
g4MaxEvents -1

# chi2 vs BW (= TOFHIR low-pass, createWaveforms lowPassMHz) before the fit
ebeScanBW 20 35 50 65 80 100 130 170

# required by the program but not used in this mode
dataFolder .
baseName pulseShape
psName g_ps
commonLabel SND_0305_ch141_ebe
tMin 10.
tMax 80.
t00 20.

# starting values: amp0 <= 0 -> automatic; BW0 = lowPassMHz, BW30 = delayLineMHz (DLED 0.58 ns = 277 MHz)
amp0 -1
BW0  65.
BW20 1194.
BW30 277.
ampMin 1e-5
ampMax 1e3
BWMax  500.
BW3Min 100.
BW3Max 800.

SiPMList SiPM_OV1 SiPM_OV2 SiPM_OV3 SiPM_OV4
</Input>

<Output>
plotFolder ./plots/drawPS_SND_eventByEvent
</Output>

# One block per OV. Shared between all OV: amp (normalization) and BW (paramX 0 everywhere).
# Fixed: t0 (irrelevant for ToT), Rq, Cd, BW2 (fitTau2 0), BW3.
# Npe 0 keeps the signal-dependent high-pass (BW2fix) off; Npe comes from Geant4 x PDE.
# TODO: SND sensor parameters (these are MTD's HPK 25 um) and the PDE at each OV.
<SiPM_OV1>
OV 1.0
PDE 1.0
Npe 0
Rq 400e3
Cq 8.6e-15
Rd 1e3
Cd 38e-15
Nc 14268
Cg 95e-12
RL 30.
RF 2.
title SND OV1
label SND_OV1
run 0305
fitYMax -1
paramAmp 0
paramT0 -1
paramRq -1
paramCd -1
paramBW 0
paramBW2 -1
paramBW3 -1
</SiPM_OV1>

